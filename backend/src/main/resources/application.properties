spring.application.name=water-atm-backend

# Database schema is owned by Flyway (src/main/resources/db/migration).
# Hibernate only checks that the Java entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Business settings
wateratm.delivery-fee-kes=20

# M-Pesa Daraja. Defaults = Safaricom's public sandbox test shortcode + passkey.
# Your own keys go in environment variables, never in git. See docs/SETUP.md.
wateratm.mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
wateratm.mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
wateratm.mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
wateratm.mpesa.shortcode=${MPESA_SHORTCODE:174379}
wateratm.mpesa.passkey=${MPESA_PASSKEY:bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919}
wateratm.mpesa.transaction-type=${MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
wateratm.mpesa.callback-base-url=${MPESA_CALLBACK_BASE_URL:http://localhost:8080}
wateratm.mpesa.callback-secret=${MPESA_CALLBACK_SECRET:dev-only-secret}
