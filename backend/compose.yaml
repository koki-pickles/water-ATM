# Local database for development.
# Spring Boot starts this automatically when you run the app (spring-boot-docker-compose).
services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=wateratm'
      - 'POSTGRES_USER=wateratm'
      - 'POSTGRES_PASSWORD=wateratm'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'

volumes:
  pgdata:
