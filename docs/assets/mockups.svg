<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D47A1"/>
      <stop offset="1" stop-color="#3D8BDB"/>
    </linearGradient>
    <clipPath id="scr1"><rect x="72" y="50" width="256" height="470" rx="20"/></clipPath>
    <clipPath id="scr2"><rect x="472" y="50" width="256" height="470" rx="20"/></clipPath>
  </defs>
  <rect width="800" height="590" fill="#FFFFFF"/>

  <!-- ===== WhatsApp bot ===== -->
  <rect x="60" y="20" width="280" height="520" rx="36" fill="#041A3D"/>
  <g clip-path="url(#scr1)">
    <rect x="72" y="50" width="256" height="470" fill="#E8F1FB"/>
    <rect x="72" y="50" width="256" height="50" fill="#0D47A1"/>
    <circle cx="96" cy="75" r="13" fill="#BBD7F5"/>
    <text x="118" y="73" font-size="15" font-weight="700" fill="#FFFFFF">Water ATM</text>
    <text x="118" y="90" font-size="11" fill="#BBD7F5">online</text>

    <g font-size="12" fill="#082E66">
      <rect x="84" y="112" width="190" height="78" rx="10" fill="#FFFFFF"/>
      <text x="96" y="132" font-weight="700">Habari! What do you need?</text>
      <text x="96" y="150">1 · Order water</text>
      <text x="96" y="166">2 · My points</text>
      <text x="96" y="182">3 · Weekly plan</text>

      <rect x="276" y="200" width="40" height="28" rx="10" fill="#BBD7F5"/>
      <text x="296" y="219" text-anchor="middle">1</text>

      <rect x="84" y="238" width="200" height="30" rx="10" fill="#FFFFFF"/>
      <text x="96" y="258">How many 20L jerrycans?</text>

      <rect x="276" y="278" width="40" height="28" rx="10" fill="#BBD7F5"/>
      <text x="296" y="297" text-anchor="middle">2</text>

      <rect x="84" y="316" width="220" height="62" rx="10" fill="#FFFFFF"/>
      <text x="96" y="336">2 × 20L + delivery = KES 120</text>
      <text x="96" y="354">Check your phone for the</text>
      <text x="96" y="370">M-Pesa prompt</text>

      <rect x="84" y="388" width="220" height="46" rx="10" fill="#1565C0"/>
      <text x="96" y="407" fill="#FFFFFF">Paid! Rider is on the way.</text>
      <text x="96" y="424" fill="#FFFFFF" font-weight="700">Delivery code: 4821</text>
    </g>

    <rect x="84" y="474" width="232" height="34" rx="17" fill="#FFFFFF"/>
    <text x="102" y="496" font-size="12" fill="#7FB3EA">Type a message</text>
  </g>
  <text x="200" y="572" text-anchor="middle" font-size="16" font-weight="700" fill="#0D47A1">WhatsApp bot</text>

  <!-- ===== Mobile app ===== -->
  <rect x="460" y="20" width="280" height="520" rx="36" fill="#041A3D"/>
  <g clip-path="url(#scr2)">
    <rect x="472" y="50" width="256" height="470" fill="#E8F1FB"/>
    <rect x="472" y="50" width="256" height="110" fill="url(#hdr)"/>
    <text x="490" y="88" font-size="20" font-weight="700" fill="#FFFFFF">Hi there</text>
    <text x="490" y="110" font-size="13" fill="#BBD7F5">Ready for fresh water?</text>

    <rect x="488" y="128" width="224" height="80" rx="14" fill="#FFFFFF" stroke="#BBD7F5"/>
    <text x="504" y="152" font-size="11" font-weight="700" fill="#3D8BDB">POINTS</text>
    <text x="504" y="181" font-size="26" font-weight="700" fill="#0D47A1">70</text>
    <text x="540" y="181" font-size="13" fill="#3D8BDB">/ 100</text>
    <text x="696" y="181" font-size="11" text-anchor="end" fill="#3D8BDB">30 to a free 20L</text>
    <rect x="504" y="192" width="192" height="6" rx="3" fill="#E8F1FB"/>
    <rect x="504" y="192" width="134" height="6" rx="3" fill="#1565C0"/>

    <rect x="488" y="224" width="224" height="52" rx="26" fill="#1565C0"/>
    <text x="600" y="256" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order water</text>

    <rect x="488" y="292" width="224" height="64" rx="14" fill="#FFFFFF"/>
    <text x="504" y="315" font-size="11" font-weight="700" fill="#3D8BDB">WEEKLY PLAN</text>
    <text x="504" y="338" font-size="14" fill="#082E66">Sat · 8:00 · 2 × 20L</text>

    <text x="488" y="382" font-size="13" font-weight="700" fill="#082E66">Recent orders</text>
    <rect x="488" y="392" width="224" height="38" rx="10" fill="#FFFFFF"/>
    <text x="502" y="416" font-size="12" fill="#082E66">17 Oct · 2 × 20L</text>
    <text x="700" y="416" font-size="12" fill="#3D8BDB" text-anchor="end">Delivered</text>
    <rect x="488" y="436" width="224" height="38" rx="10" fill="#FFFFFF"/>
    <text x="502" y="460" font-size="12" fill="#082E66">10 Oct · 1 × 20L</text>
    <text x="700" y="460" font-size="12" fill="#3D8BDB" text-anchor="end">Delivered</text>

    <rect x="472" y="484" width="256" height="36" fill="#FFFFFF"/>
    <g font-size="11" text-anchor="middle">
      <text x="504" y="507" fill="#1565C0" font-weight="700">Home</text>
      <text x="568" y="507" fill="#7FB3EA">Orders</text>
      <text x="632" y="507" fill="#7FB3EA">Points</text>
      <text x="696" y="507" fill="#7FB3EA">Account</text>
    </g>
  </g>
  <text x="600" y="572" text-anchor="middle" font-size="16" font-weight="700" fill="#0D47A1">Mobile app</text>
</svg>
